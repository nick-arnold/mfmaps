name: MRMS Daily Precip (30-day rolling store)

# Maintains a rolling 30-day archive of daily MRMS 24-hour QPE rasters, then
# derives three weekly sums and a 30-day total from that archive.
#
# DESIGN: this job RECONCILES, it does not append. Every run computes the set of
# dates that should exist, lists what actually exists in Spaces, and downloads
# only the difference. Consequences:
#   - The first run is the backfill. There is no separate backfill script.
#   - A skipped/failed run self-heals on the next execution. No permanent holes.
#   - Pass2's publish lag is harmless: a day that isn't out yet is just missing,
#     and gets picked up on a later run.
#
# ORDERING: derive runs in the same job, after reconcile, on purpose. Two
# independent crons would let the sums fire before the day they need has
# landed, producing a silently short weekly total.
#
# IMMUTABILITY: every raster is dated and never overwritten. The ONLY mutable
# object is precip/derived/index.json. Overwriting a large object that the
# Django endpoint is range-requesting through a CDN can splice bytes from two
# versions into one response -- no error, just a wrong number.

on:
  schedule:
    # 09:00 UTC daily. GitHub cron is best-effort and runs get dropped under
    # load; that's fine here because reconcile catches up.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      run_reconcile:
        description: 'Fetch missing daily rasters (true/false)'
        required: false
        default: 'true'
      run_derive:
        description: 'Build weekly + 30-day sums (true/false)'
        required: false
        default: 'true'
      window_days:
        description: 'Days to keep in the rolling store'
        required: false
        default: '30'
      prune:
        description: 'Delete objects older than the window (true/false)'
        required: false
        default: 'true'

concurrency:
  group: mrms-precip-daily
  cancel-in-progress: false

env:
  # --- Destination ---
  DEST_BUCKET: mfmaps-tiles
  DAILY_PREFIX: precip/daily
  DERIVED_PREFIX: precip/derived
  SPACES_EP: https://sfo3.digitaloceanspaces.com
  CDN_ENDPOINT_ID: 5a2c1d80-7525-4181-aa71-8a5c7fbfdf33

  # --- Window ---
  WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
  PRUNE: ${{ github.event.inputs.prune || 'true' }}
  RUN_RECONCILE: ${{ github.event.inputs.run_reconcile || 'true' }}
  RUN_DERIVE: ${{ github.event.inputs.run_derive || 'true' }}

  # How many days back the newest expected COVERED day sits. A day's precip is
  # published as a file stamped the NEXT day at 00Z, and Pass2 itself lags ~24h,
  # so 2 is the first offset that's reliably available.
  LAG_DAYS: 2

  # --- Source ---
  # NOAA Open Data bucket. Public, no account needed. Verified 2026-08-09 to
  # reach back at least 30 days.
  NOAA_BUCKET: noaa-mrms-pds
  NOAA_PREFIX: CONUS/MultiSensor_QPE_24H_Pass2_00.00
  NOAA_REGION: us-east-1

  # Cuts pointless sidecar probes (.aux.xml/.ovr/.msk) on every /vsicurl/ open.
  # Spaces returns 403 rather than 404 for those, which looks alarming and
  # wastes a round trip each.
  GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install GDAL
        run: |
          sudo apt-get update -qq
          # NOTE: do NOT try to apt-get install gunzip -- there is no such
          # package, it ships inside gzip and is already present.
          # NOTE: do NOT apt-get install awscli either -- GitHub runners ship
          # AWS CLI v2 already, and Ubuntu 24.04 dropped the package, so asking
          # for it fails the step with exit 100.
          sudo apt-get install -y -qq gdal-bin python3-gdal
          gdalinfo --version
          aws --version

      # ------------------------------------------------------------------
      # RECONCILE
      # ------------------------------------------------------------------

      - name: Work out which days are missing
        if: env.RUN_RECONCILE == 'true'
        run: |
          set -euo pipefail
          EP="--endpoint-url ${SPACES_EP}"

          # Desired covered days: LAG_DAYS back, WINDOW_DAYS long.
          DESIRED=""
          for i in $(seq "${LAG_DAYS}" $(( LAG_DAYS + WINDOW_DAYS - 1 ))); do
            DESIRED="${DESIRED} $(date -u -d "${i} days ago" +%Y%m%d)"
          done
          echo "Desired window: $(echo ${DESIRED} | awk '{print $NF" -> "$1}')"

          # Listing needs credentials even though the objects are public-read.
          aws s3 ls "s3://${DEST_BUCKET}/${DAILY_PREFIX}/" ${EP} \
            | awk '{print $NF}' > existing_keys.txt || true
          grep -oE 'mrms_qpe24_[0-9]{8}\.tif' existing_keys.txt \
            | grep -oE '[0-9]{8}' | sort -u > existing_dates.txt || true
          echo "Already stored: $(wc -l < existing_dates.txt) day(s)"

          MISSING=""
          for D in ${DESIRED}; do
            if ! grep -qx "${D}" existing_dates.txt 2>/dev/null; then
              MISSING="${MISSING} ${D}"
            fi
          done
          MISSING=$(echo ${MISSING} | xargs || true)

          echo "${MISSING}" > missing_dates.txt
          echo "Missing: ${MISSING:-none} ($(echo ${MISSING} | wc -w) day(s))"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}

      - name: Fetch, convert, and upload missing days
        if: env.RUN_RECONCILE == 'true'
        run: |
          set -uo pipefail
          EP="--endpoint-url ${SPACES_EP}"
          MISSING=$(cat missing_dates.txt)
          mkdir -p work

          FETCHED=0; FAILED=""

          for D in ${MISSING}; do
            D_ISO=$(date -u -d "${D}" +%Y-%m-%d)

            # OFF-BY-ONE, READ THIS BEFORE CHANGING ANYTHING:
            # MRMS 24H QPE filenames carry the END of the accumulation period.
            # The file stamped D+1 at 000000 covers 00Z(D) -> 00Z(D+1), i.e. the
            # precip that fell on day D. We name our COG for the day the rain
            # fell, so the stamp is always D+1. Get this backwards and every
            # weekly sum is shifted one day.
            STAMP=$(date -u -d "${D_ISO} + 1 day" +%Y%m%d)
            FN="MRMS_MultiSensor_QPE_24H_Pass2_00.00_${STAMP}-000000.grib2.gz"
            KEY="${NOAA_PREFIX}/${STAMP}/${FN}"

            echo "=== ${D_ISO}  (source stamp ${STAMP}) ==="

            # --no-sign-request for the public NOAA bucket. --region is explicit
            # so this call can't inherit anything meant for Spaces.
            if ! aws s3 cp "s3://${NOAA_BUCKET}/${KEY}" "work/${FN}" \
                 --no-sign-request --region "${NOAA_REGION}" --only-show-errors; then
              echo "  not available yet -- will retry on a later run"
              FAILED="${FAILED} ${D}"
              continue
            fi

            gunzip -f "work/${FN}"
            GRIB="work/${FN%.gz}"

            gdalinfo "${GRIB}" | grep -E 'Size is|Upper Left|Lower Right' || true

            # Values are mm. Store Int16 at 0.1 mm: 3276 mm of headroom, half
            # the size of Float32. MRMS uses negative flags (-1, -3) for
            # missing/no-coverage, so anything < 0 becomes nodata in one sweep.
            # --hideNoData means we see raw values and OUR where() decides.
            gdal_calc.py -A "${GRIB}" --outfile=work/i16.tif \
              --calc="numpy.where(A<0, -9999, numpy.rint(A*10))" \
              --type=Int16 --NoDataValue=-9999 --hideNoData \
              --co COMPRESS=DEFLATE --quiet

            # Pin the CONUS domain and CRS. MRMS CONUS is 20-55N, 130-60W at
            # 0.01 deg = 7000x3500. Verified correct 2026-08-09 against known
            # rainfall at known points.
            gdal_translate -q -a_srs EPSG:4326 -a_ullr -130.0 55.0 -60.0 20.0 \
              work/i16.tif work/geo.tif

            # COG, internally tiled. BLOCKSIZE matters: the point-query endpoint
            # range-requests a single block per click. A striped GeoTIFF would
            # pull a full 7000px scanline instead of a 512x512 tile.
            # OVERVIEWS=NONE -- point queries read native resolution only.
            OUT="mrms_qpe24_${D}.tif"
            gdal_translate -q -of COG work/geo.tif "${OUT}" \
              -co COMPRESS=DEFLATE -co PREDICTOR=2 -co BLOCKSIZE=512 \
              -co OVERVIEWS=NONE -co NUM_THREADS=ALL_CPUS

            # Sanity: a nationwide day with zero precipitation anywhere does not
            # happen. All-nodata or all-zero means the decode is wrong.
            MAXV=$(gdalinfo -stats "${OUT}" | grep -oE 'STATISTICS_MAXIMUM=[-0-9.]+' | cut -d= -f2)
            echo "  max = ${MAXV} (0.1mm units)"
            if [ -z "${MAXV}" ] || [ "$(printf '%.0f' "${MAXV}")" -le 0 ]; then
              echo "  FATAL: no positive precip anywhere -- decode is wrong" >&2
              exit 1
            fi

            # Public-read: lets the Django point query use /vsicurl/ with no
            # credentials, and puts range requests behind the CDN.
            aws s3 cp "${OUT}" "s3://${DEST_BUCKET}/${DAILY_PREFIX}/${OUT}" \
              ${EP} --acl public-read --only-show-errors

            rm -f "${OUT}" work/i16.tif work/geo.tif "${GRIB}"
            FETCHED=$(( FETCHED + 1 ))
          done

          echo "fetched=${FETCHED}" >> "$GITHUB_ENV"
          echo "failed=$(echo ${FAILED} | xargs || true)" >> "$GITHUB_ENV"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}

      # ------------------------------------------------------------------
      # DERIVE
      # ------------------------------------------------------------------

      - name: Write the summing helper
        if: env.RUN_DERIVE == 'true'
        run: |
          cat > sum_days.py <<'PY'
          import sys, numpy as np
          from osgeo import gdal
          gdal.UseExceptions()

          NODATA = -9999
          out_path, files = sys.argv[1], sys.argv[2:]

          # Refuse to sum a short window. Quietly adding six days and calling it
          # a week is the exact bug this pipeline exists to avoid.
          if not files:
              sys.exit("FATAL: no input files")

          acc = None
          valid = None
          for f in files:
              ds = gdal.Open(f)
              if ds is None:
                  sys.exit(f"FATAL: cannot open {f}")
              band = ds.GetRasterBand(1)
              arr = band.ReadAsArray().astype(np.int32)
              ok = arr != NODATA
              if acc is None:
                  acc = np.zeros(arr.shape, dtype=np.int32)
                  valid = np.ones(arr.shape, dtype=bool)
                  ref = ds
                  gt, proj = ds.GetGeoTransform(), ds.GetProjection()
              elif arr.shape != acc.shape:
                  sys.exit(f"FATAL: {f} shape {arr.shape} != {acc.shape}")
              acc += np.where(ok, arr, 0)
              # A pixel outside radar coverage is outside it every day, so
              # any-nodata -> nodata keeps the coverage mask honest.
              valid &= ok
              ds = None

          peak = int(acc[valid].max()) if valid.any() else 0
          if peak > 32767:
              sys.exit(f"FATAL: sum {peak} overflows Int16 at 0.1mm -- "
                       "rescale before shipping this")

          acc = np.where(valid, acc, NODATA).astype(np.int16)

          drv = gdal.GetDriverByName('GTiff')
          out = drv.Create(out_path, acc.shape[1], acc.shape[0], 1,
                           gdal.GDT_Int16, ['COMPRESS=DEFLATE'])
          out.SetGeoTransform(gt); out.SetProjection(proj)
          b = out.GetRasterBand(1)
          b.WriteArray(acc); b.SetNoDataValue(NODATA)
          out = None
          print(f"  {out_path}: {len(files)} days, peak {peak} (0.1mm)")
          PY
          echo "helper written"

      - name: Build weekly and 30-day sums
        if: env.RUN_DERIVE == 'true'
        run: |
          set -euo pipefail
          EP="--endpoint-url ${SPACES_EP}"
          mkdir -p daily derived

          # Pull the whole store down once. ~30 small COGs; cheaper and more
          # predictable than 30 concurrent /vsicurl/ reads inside GDAL.
          aws s3 cp "s3://${DEST_BUCKET}/${DAILY_PREFIX}/" daily/ \
            --recursive --exclude "*" --include "mrms_qpe24_*.tif" \
            ${EP} --only-show-errors
          echo "Local dailies: $(ls daily | wc -l)"

          date_for_offset () { date -u -d "$1 days ago" +%Y%m%d; }

          # Every product is named for the LAST day it covers.
          declare -A SPEC
          ALL_DATES=""
          JSON_WEEKS=""

          for W in 1 2 3; do
            START_OFF=$(( LAG_DAYS + (W - 1) * 7 ))
            FILES=""; DATES=""
            for i in $(seq 0 6); do
              D=$(date_for_offset $(( START_OFF + i )))
              F="daily/mrms_qpe24_${D}.tif"
              if [ ! -f "${F}" ]; then
                echo "FATAL: week ${W} needs ${D}, which is not in the store." >&2
                echo "Refusing to publish a short week. Re-run reconcile." >&2
                exit 1
              fi
              FILES="${FILES} ${F}"; DATES="${DATES} ${D}"
            done
            END=$(date_for_offset ${START_OFF})
            BEGIN=$(date_for_offset $(( START_OFF + 6 )))
            OUT="derived/mrms_week${W}_${END}.tif"
            echo "=== week ${W}: ${BEGIN} -> ${END} ==="
            python3 sum_days.py "${OUT}" ${FILES}
            SPEC[week${W}]="mrms_week${W}_${END}.tif|${BEGIN}|${END}"
          done

          # 30-day total over the full window.
          FILES=""; ALL_DATES=""
          for i in $(seq "${LAG_DAYS}" $(( LAG_DAYS + WINDOW_DAYS - 1 ))); do
            D=$(date_for_offset ${i})
            F="daily/mrms_qpe24_${D}.tif"
            if [ ! -f "${F}" ]; then
              echo "FATAL: 30-day total needs ${D}, missing from store." >&2
              exit 1
            fi
            FILES="${FILES} ${F}"; ALL_DATES="${ALL_DATES} ${D}"
          done
          W_END=$(date_for_offset ${LAG_DAYS})
          W_BEGIN=$(date_for_offset $(( LAG_DAYS + WINDOW_DAYS - 1 )))
          echo "=== ${WINDOW_DAYS}-day: ${W_BEGIN} -> ${W_END} ==="
          python3 sum_days.py "derived/mrms_${WINDOW_DAYS}day_${W_END}.tif" ${FILES}

          # Convert all sums to COG and upload. Overviews left on (default) --
          # unlike the dailies, these get tiled for display.
          for F in derived/*.tif; do
            case "${F}" in *_cog.tif) continue;; esac
            B=$(basename "${F}" .tif)
            gdal_translate -q -of COG "${F}" "derived/${B}_cog.tif" \
              -co COMPRESS=DEFLATE -co PREDICTOR=2 -co BLOCKSIZE=512 \
              -co NUM_THREADS=ALL_CPUS
            aws s3 cp "derived/${B}_cog.tif" \
              "s3://${DEST_BUCKET}/${DERIVED_PREFIX}/${B}.tif" \
              ${EP} --acl public-read --only-show-errors
            echo "uploaded ${B}.tif"
          done

          # Sidecar index. The ONLY mutable object in the product. Band/date and
          # product/date-range mapping live here, not in filenames the endpoint
          # has to parse, and not in TIFF metadata it would have to fetch.
          {
            echo '{'
            echo "  \"generated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"units\": \"0.1 mm, Int16, nodata -9999\","
            echo "  \"grid\": \"EPSG:4326, 0.01 deg, 7000x3500, -130/55 to -60/20\","
            echo "  \"base_url\": \"https://${DEST_BUCKET}.sfo3.cdn.digitaloceanspaces.com/${DERIVED_PREFIX}/\","
            echo "  \"daily_url\": \"https://${DEST_BUCKET}.sfo3.cdn.digitaloceanspaces.com/${DAILY_PREFIX}/\","
            echo "  \"window\": {\"start\": \"${W_BEGIN}\", \"end\": \"${W_END}\", \"days\": ${WINDOW_DAYS}},"
            echo "  \"total\": \"mrms_${WINDOW_DAYS}day_${W_END}.tif\","
            echo '  "weeks": {'
            SEP=""
            for W in 1 2 3; do
              IFS='|' read -r FN B E <<< "${SPEC[week${W}]}"
              printf '%s    "week%s": {"file": "%s", "start": "%s", "end": "%s"}' "${SEP}" "${W}" "${FN}" "${B}" "${E}"
              SEP=$',\n'
            done
            echo ''
            echo '  },'
            echo -n '  "dates": ['
            echo -n "$(echo ${ALL_DATES} | sed 's/ /", "/g' | sed 's/^/"/; s/$/"/')"
            echo ']'
            echo '}'
          } > index.json

          python3 -c "import json;json.load(open('index.json'));print('index.json valid')"
          aws s3 cp index.json "s3://${DEST_BUCKET}/${DERIVED_PREFIX}/index.json" \
            ${EP} --acl public-read --content-type application/json --only-show-errors
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}

      - name: Purge CDN cache for the index only
        if: env.RUN_DERIVE == 'true'
        run: |
          # Everything else is immutable and dated, so it must never be purged
          # or re-requested. Only index.json changes.
          curl -s -X DELETE \
            "https://api.digitalocean.com/v2/cdn/endpoints/${CDN_ENDPOINT_ID}/cache" \
            -H "Authorization: Bearer ${{ secrets.DO_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"files\": [\"${DERIVED_PREFIX}/index.json\"]}"
          echo "purged index.json"

      # ------------------------------------------------------------------
      # PRUNE
      # ------------------------------------------------------------------

      - name: Prune old dailies and derived products
        if: env.PRUNE == 'true'
        run: |
          set -euo pipefail
          EP="--endpoint-url ${SPACES_EP}"
          CUTOFF=$(date -u -d "$(( LAG_DAYS + WINDOW_DAYS )) days ago" +%Y%m%d)
          DERIVED_CUTOFF=$(date -u -d "10 days ago" +%Y%m%d)
          echo "Daily cutoff ${CUTOFF}; derived cutoff ${DERIVED_CUTOFF}"

          # NOTE: scoped to these two prefixes on purpose. Never widen this to
          # s3://mfmaps-tiles/precip/* -- the daily store is the only copy of
          # days that have aged out of the NOAA bucket.
          prune_prefix () {
            local PREFIX="$1" CUT="$2"
            aws s3 ls "s3://${DEST_BUCKET}/${PREFIX}/" ${EP} \
              | awk '{print $NF}' | grep -E '\.tif$' | sort -u \
            | while read -r F; do
                FD=$(echo "${F}" | grep -oE '[0-9]{8}' | tail -1)
                if [ -n "${FD}" ] && [ "${FD}" -lt "${CUT}" ]; then
                  echo "  rm ${PREFIX}/${F}"
                  aws s3 rm "s3://${DEST_BUCKET}/${PREFIX}/${F}" ${EP} --only-show-errors
                fi
              done
          }

          prune_prefix "${DAILY_PREFIX}" "${CUTOFF}"
          prune_prefix "${DERIVED_PREFIX}" "${DERIVED_CUTOFF}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}

      - name: Summary
        if: always()
        run: |
          EP="--endpoint-url ${SPACES_EP}"
          DCOUNT=$(aws s3 ls "s3://${DEST_BUCKET}/${DAILY_PREFIX}/" ${EP} 2>/dev/null \
                   | grep -c 'mrms_qpe24_' || echo 0)
          {
            echo "### MRMS precip"
            echo ""
            echo "- Window: ${WINDOW_DAYS} days, ending ${LAG_DAYS} days back"
            echo "- Downloaded this run: **${fetched:-0}**"
            echo "- Unavailable (will retry): \`${failed:-none}\`"
            echo "- Days in store: **${DCOUNT}** / ${WINDOW_DAYS}"
            echo "- Daily: \`s3://${DEST_BUCKET}/${DAILY_PREFIX}/\`"
            echo "- Derived: \`s3://${DEST_BUCKET}/${DERIVED_PREFIX}/\` (index.json is the pointer)"
            echo "- Encoding: Int16, 0.1 mm, nodata -9999, EPSG:4326, COG 512px blocks"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}