server {
    listen 80;
    server_name mfmaps.com www.mfmaps.com map.mfmaps.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else returns a quick OK so we can verify nginx works
    location / {
        return 200 'mfmaps temporary';
        add_header Content-Type text/plain;
    }
}
